<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LDCI — Messages Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#08b56a;--green2:#087a4d;--dark:#061b13;--bg:#f4f7f6;--line:#e4e9e7;--muted:#7b8581;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#101514}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#05271a,#0a6e48)}
.login-card{width:min(420px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px #0005;text-align:center}
.logo{width:72px;height:72px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#09bd70,#08774c);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
.login-card h1{margin:18px 0 5px;font-size:24px}.login-card p{margin:0 0 22px;color:var(--muted)}
.pin{width:100%;padding:15px;border:1px solid #dce3e0;border-radius:14px;text-align:center;font-size:22px;letter-spacing:7px;outline:none}
.primary{width:100%;margin-top:12px;padding:14px;border-radius:14px;background:var(--green);color:#fff;font-weight:800}
.err{color:#d92828;min-height:22px;font-size:13px;margin-top:9px}
#app{display:none;height:100vh;overflow:hidden}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
.top-logo{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.top h2{font-size:18px;margin:0}.top small{display:block;color:var(--muted);margin-top:2px}
.logout{margin-left:auto;background:#f1f5f3;color:#2c3934;padding:9px 12px;border-radius:11px;font-weight:700}
.layout{height:calc(100vh - 68px);display:grid;grid-template-columns:350px 1fr;min-height:0}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:13px;border-bottom:1px solid var(--line)}.search input{width:100%;border:0;background:#f1f4f3;border-radius:13px;padding:12px 14px;outline:none}
.list{overflow:auto;min-height:0}.person{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #f0f2f1;align-items:center;position:relative}
.person:hover,.person.active{background:#edf9f4}.avatar{width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(145deg,#0ab96c,#087b4e);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.pbody{min-width:0;flex:1}.phead{display:flex;align-items:center;gap:7px}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{margin-left:auto;font-size:11px;color:#818b87;white-space:nowrap}.preview{font-size:12px;color:#6c7772;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:800}.msg-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:6px}.msg-actions button{font-size:10px;border-radius:8px;padding:4px 7px;background:#eef4f1;color:#304039}.msg-actions .danger{color:#fff;background:#ef4444}.edited{font-style:italic;color:#8b9590;margin-left:4px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:#eaf1ee}
.chat-empty{margin:auto;text-align:center;color:#7a8580}.chat-empty .big{font-size:45px}.chathead{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:11px}.chathead .avatar{width:44px;height:44px}.chatname{font-weight:800}.chatphone{font-size:11px;color:#87918d;margin-top:3px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.day{text-align:center;color:#89938f;font-size:11px;margin:4px 0 8px}.bubble{max-width:min(72%,560px);padding:10px 13px;border-radius:16px;line-height:1.4;font-size:14px;box-shadow:0 1px 2px #0000000b;white-space:pre-wrap;word-break:break-word}.mine{align-self:flex-end;background:#c9f5df;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.meta{font-size:9px;color:#77817d;text-align:right;margin-top:5px}
.composer{background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:9px;align-items:flex-end}.composer textarea{flex:1;resize:none;max-height:130px;min-height:44px;border:1px solid #dce4e0;border-radius:14px;padding:11px 13px;outline:none}.send{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;font-size:20px;font-weight:900}
.notice{padding:8px 14px;background:#fff7df;color:#765b13;font-size:11px;text-align:center;display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:flex}.chat{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .chat{display:flex}.top{padding:0 12px}.back{display:block!important}.messages{padding:13px}.bubble{max-width:85%}}
.back{display:none;background:#eef4f1;border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<section id="login">
 <div class="login-card">
  <div class="logo">💬</div>
  <h1>LDCI LONG TERME</h1><p>Panneau messages administrateur</p>
  <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="10" placeholder="•••••">
  <button class="primary" id="loginBtn">🔐 Ouvrir les messages</button>
  <div id="loginErr" class="err"></div>
 </div>
</section>

<section id="app">
 <header class="top">
  <div class="top-logo">L</div>
  <div><h2>Messages</h2><small>LDCI LONG TERME · Support</small></div>
  <button class="logout" id="logoutBtn">Quitter</button>
 </header>
 <main class="layout" id="layout">
  <aside class="sidebar">
   <div class="search"><input id="search" placeholder="🔎 Rechercher un utilisateur..."></div>
   <div class="notice" id="loadNotice">Chargement des utilisateurs…</div>
   <div class="list" id="userList"></div>
  </aside>
  <section class="chat">
   <div class="chat-empty" id="chatEmpty"><div class="big">💬</div><b>Sélectionnez un utilisateur</b><div>Les conversations apparaîtront ici.</div></div>
   <div id="chatPanel" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div class="chathead">
      <button class="back" id="backBtn">←</button>
      <div class="avatar" id="chatAvatar">U</div>
      <div><div class="chatname" id="chatName">Utilisateur</div><div class="chatphone" id="chatPhone"></div></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="messageInput" rows="1" placeholder="Écrire un message…"></textarea>
      <button class="send" id="sendBtn">➤</button>
    </div>
   </div>
  </section>
 </main>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,collection,collectionGroup,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDkk8hgs1GIMuFT__SP8YnVNY3PA2vTew",
 authDomain:"vigora-8e490.firebaseapp.com",
 projectId:"vigora-8e490",
 storageBucket:"vigora-8e490.firebasestorage.app",
 messagingSenderId:"832329608128",
 appId:"1:832329608128:web:4e5af7387d7891a31d7625"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const ADMIN_PIN="09800";
const $=id=>document.getElementById(id);
let users=new Map(),threads=new Map(),selected=null,unsubMessages=null,unsubUnread=null;

function key(v){let d=String(v||"").replace(/\D/g,"");if(d.startsWith("243"))d=d.slice(3);if(d.startsWith("0"))d=d.slice(1);return d.slice(0,9)}
function displayPhone(v){let k=key(v);return k?"+243 "+k:""}
function initials(u){let s=(u.name||displayPhone(u.phone)||"U").trim();return s.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function timeVal(v){if(!v)return 0;if(typeof v.toMillis==="function")return v.toMillis();if(typeof v==="string")return Date.parse(v)||0;return v.seconds?Number(v.seconds)*1000:0}
function fmtDate(v){let t=timeVal(v);if(!t)return "";let d=new Date(t),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function getUser(k){return users.get(k)||{phone:k,name:"Utilisateur"}}
function renderList(){
 const term=$("search").value.trim().toLowerCase();
 const arr=[...users.values()].filter(u=>(u.name||"").toLowerCase().includes(term)||displayPhone(u.phone).includes(term)||String(u.phone||"").includes(term));
 arr.sort((a,b)=>{
   const ta=timeVal(threads.get(key(a.phone))?.updatedAt),tb=timeVal(threads.get(key(b.phone))?.updatedAt);
   if(tb!==ta)return tb-ta;
   return String(a.name||a.phone).localeCompare(String(b.name||b.phone),"fr",{numeric:true});
 });
 $("userList").innerHTML="";
 if(!arr.length){$("userList").innerHTML='<div style="padding:30px;text-align:center;color:#89938f">Aucun utilisateur</div>';return}
 arr.forEach(u=>{
   const k=key(u.phone),th=threads.get(k)||{}, unread=th.unreadForAdmin===true;
   const el=document.createElement("div");el.className="person"+(selected===k?" active":"");el.onclick=()=>openChat(k);
   const av=document.createElement("div");av.className="avatar";
   if(u.photoURL||u.photoUrl){const im=document.createElement("img");im.src=u.photoURL||u.photoUrl;im.onerror=()=>{av.textContent=initials(u)};av.appendChild(im)}else av.textContent=initials(u);
   const body=document.createElement("div");body.className="pbody";
   const head=document.createElement("div");head.className="phead";
   const name=document.createElement("span");name.className="name";name.textContent=u.name||"Utilisateur";
   head.appendChild(name);
   const unreadNumber=Number(th.unreadCount||0);
   if(unreadNumber>0){
     const b=document.createElement("span");
     b.className="badge";
     b.dataset.badge=k;
     b.title=unreadNumber+" message"+(unreadNumber>1?"s":"")+" non lu"+(unreadNumber>1?"s":"");
     b.textContent=unreadNumber>99?"99+":String(unreadNumber);
     head.appendChild(b);
   }
   const date=document.createElement("span");date.className="date";date.textContent=fmtDate(th.updatedAt||u.createdAt);head.appendChild(date);
   const preview=document.createElement("div");preview.className="preview";preview.textContent=th.lastMessage||"Aucune conversation";
   body.appendChild(head);body.appendChild(preview);
   el.appendChild(av);el.appendChild(body);
   $("userList").appendChild(el);
 });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openChat(k){
 selected=k;const u=getUser(k);$("chatEmpty").style.display="none";$("chatPanel").style.display="flex";
 $("chatName").textContent=u.name||"Utilisateur";$("chatPhone").textContent=displayPhone(u.phone);
 $("chatAvatar").textContent=initials(u);$("chatAvatar").innerHTML="";
 if(u.photoURL||u.photoUrl){const im=document.createElement("img");im.src=u.photoURL||u.photoUrl;im.onerror=()=>{$("chatAvatar").textContent=initials(u)};$("chatAvatar").appendChild(im)}else $("chatAvatar").textContent=initials(u);
 $("layout").classList.add("chat-open");renderList();
 if(unsubMessages)unsubMessages();
 unsubMessages=onSnapshot(query(collection(db,"supportThreads",k,"messages"),orderBy("createdAt","asc")),snap=>{
   const docs=snap.docs.map(d=>({id:d.id,...d.data()}));renderMessages(docs);
   // Dès que l'administrateur ouvre la conversation, tous les messages utilisateur visibles deviennent lus.
   snap.docs.forEach(d=>{const m=d.data();if(m.sender==="user" && m.readByAdmin!==true){updateDoc(d.ref,{readByAdmin:true}).catch(()=>{});}});
 });
 setDoc(doc(db,"supportThreads",k),{unreadForAdmin:false,unreadCount:0},{merge:true}).catch(()=>{});
}
function renderMessages(arr){
 const box=$("messages");box.innerHTML="";
 arr.forEach(m=>{
   const row=document.createElement("div");row.className="bubble "+(m.sender==="admin"?"mine":"theirs");
   const text=document.createElement("div");text.textContent=m.text||"";row.appendChild(text);
   const meta=document.createElement("div");meta.className="meta";meta.textContent=(m.sender==="admin"?"Vous · ":"")+fmtDate(m.createdAt)+(m.edited?" · modifié":"");row.appendChild(meta);
   if(m.sender==="admin"){
     const actions=document.createElement("div");actions.className="msg-actions";
     const edit=document.createElement("button");edit.textContent="✏️ Modifier";edit.onclick=()=>editMessage(m.id,m.text||"");
     const del=document.createElement("button");del.textContent="🗑️ Supprimer";del.className="danger";del.onclick=()=>deleteMessage(m.id);
     actions.append(edit,del);row.appendChild(actions);
   }
   box.appendChild(row);
 });
 box.scrollTop=box.scrollHeight;
}
async function editMessage(id,currentText){
 const next=prompt("Modifier le message :",currentText);
 if(next===null)return;
 const text=next.trim();if(!text)return alert("Le message ne peut pas être vide.");
 try{await updateDoc(doc(db,"supportThreads",selected,"messages",id),{text,edited:true,editedAt:serverTimestamp()});
   await setDoc(doc(db,"supportThreads",selected),{lastMessage:text,updatedAt:serverTimestamp()},{merge:true});
 }catch(e){alert("Impossible de modifier ce message.");console.error(e)}
}
async function deleteMessage(id){
 if(!confirm("Supprimer définitivement ce message ?"))return;
 try{
   await deleteDoc(doc(db,"supportThreads",selected,"messages",id));
   // Le dernier aperçu sera recalculé par la prochaine ouverture de conversation.
 }catch(e){alert("Impossible de supprimer ce message. Vérifiez les règles Firestore.");console.error(e)}
}
async function sendMessage(){
 if(!selected)return;
 const input=$("messageInput"),text=input.value.trim();if(!text)return;
 input.disabled=true;$("sendBtn").disabled=true;
 try{
   await addDoc(collection(db,"supportThreads",selected,"messages"),{sender:"admin",senderPhone:"admin",text,createdAt:serverTimestamp(),readByUser:false});
   await setDoc(doc(db,"supportThreads",selected),{
     phone:selected,name:getUser(selected).name||"",lastMessage:text,lastSender:"admin",
     updatedAt:serverTimestamp(),unreadForUser:true,unreadForAdmin:false,unreadCount:0
   },{merge:true});
   input.value="";input.style.height="auto";
 }catch(e){alert("Impossible d'envoyer le message. Vérifiez les règles Firestore.");console.error(e)}
 input.disabled=false;$("sendBtn").disabled=false;input.focus();
}
function start(){
 $("login").style.display="none";$("app").style.display="block";
 $("loadNotice").style.display="block";
 onSnapshot(collection(db,"users"),snap=>{
   users.clear();snap.forEach(d=>{const u=d.data();users.set(key(u.phone||d.id),{...u,phone:u.phone||d.id})});$("loadNotice").style.display="none";renderList();
 },e=>{console.error(e);$("loadNotice").textContent="Erreur de lecture des utilisateurs.";});
 onSnapshot(collection(db,"supportThreads"),snap=>{
   threads.clear();snap.forEach(d=>threads.set(key(d.id),{id:d.id,...d.data()}));renderList();
 },e=>console.error(e));
 if(unsubUnread)unsubUnread();
 // Compte en temps réel les messages non lus envoyés par les utilisateurs.
 unsubUnread=onSnapshot(collectionGroup(db,"messages"),snap=>{
   const counts=new Map();
   snap.forEach(d=>{
     const m=d.data();
     if(m.sender==="user" && m.readByAdmin!==true){
       const parent=d.ref.parent.parent;
       const k=parent?key(parent.id):"";
       if(k)counts.set(k,(counts.get(k)||0)+1);
     }
   });
   threads.forEach((th,k)=>{th.unreadCount=counts.get(k)||0;th.unreadForAdmin=th.unreadCount>0;});
   renderList();
 },e=>console.error("Compteur messages:",e));
}
$("loginBtn").onclick=()=>{if($("pin").value===ADMIN_PIN)start();else $("loginErr").textContent="Code administrateur incorrect."};
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick=()=>location.reload();
$("search").addEventListener("input",renderList);
$("sendBtn").onclick=sendMessage;
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
$("messageInput").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px"});
$("backBtn").onclick=()=>{$("layout").classList.remove("chat-open");selected=null;renderList()};
</script>
</body>
</html>
